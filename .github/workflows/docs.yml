name: docs

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "docs/**"
      - "packages/ai/**"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "src/**"
      - "docs/**"
      - "packages/ai/**"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"

jobs:
  docs:
    runs-on: ubuntu-latest
    env:
      # The verifier uses Playwright's bundled Chromium here, not an installed Chrome.
      DOCS_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: each page's last-updated date is its newest commit, and a
          # shallow clone has no dates at all.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the library
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm --filter slotsmith-docs exec playwright install --with-deps chromium

      - name: Test
        run: pnpm --filter slotsmith-docs test

      - name: Check
        run: pnpm --filter slotsmith-docs check

      - name: Build and verify the site
        run: pnpm --filter slotsmith-docs build

      - name: Upload the site
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: docs/dist
