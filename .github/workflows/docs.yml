name: docs

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "docs/**"
      - "packages/ai/**"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "src/**"
      - "docs/**"
      - "packages/ai/**"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"

jobs:
  docs:
    runs-on: ubuntu-latest
    env:
      # The verifier uses Playwright's bundled Chromium here, not an installed Chrome.
      DOCS_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: each page's last-updated date is its newest commit, and a
          # shallow clone has no dates at all.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the library
        run: pnpm build

      # The docs facts step runs the library's own suite; these cover the rest.
      - name: Typecheck the library
        run: pnpm typecheck

      - name: Typecheck slotsmith-ai
        run: pnpm typecheck:ai

      - name: Test slotsmith-ai
        run: pnpm test:ai

      # The framework examples install the built library, the way an app would.
      - name: Build the Next.js example
        run: pnpm --filter example-next build

      - name: Build the Vite example
        run: pnpm --filter example-vite build

      - name: Install Chromium for Playwright
        run: pnpm --filter slotsmith-docs exec playwright install --with-deps chromium

      - name: Check
        run: pnpm --filter slotsmith-docs check
        env:
          DOCS_STRICT: "1"

      # Strict mode: a page still marked as a stub fails the build.
      - name: Build and verify the site
        run: pnpm --filter slotsmith-docs build
        env:
          DOCS_STRICT: "1"

      # After the build: the tests read the reference and facts data it
      # generates into src/generated (gitignored).
      - name: Test
        run: pnpm --filter slotsmith-docs test

      # Mobile Lighthouse on the built site (docs/lighthouserc.cjs): every
      # category at 0.95 or more and layout shift at 0.01 or less.
      - name: Lighthouse
        run: pnpm --filter slotsmith-docs exec lhci autorun

      - name: Upload the site
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: docs/dist

      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: docs/.lighthouseci
          include-hidden-files: true
