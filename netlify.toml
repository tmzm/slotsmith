# Netlify builds the docs site (docs/) from this monorepo.
#
# Link the Netlify site to the repo and leave the build settings empty in the
# UI: everything is read from here. Steps: docs/LAUNCH-REPORT.md, "Owner actions".

[build]
  base = "docs"
  publish = "dist"
  # Runs from `docs/`. Installs with the frozen lockfile, builds the library
  # (the docs facts step reads ../dist), then builds the docs:
  # reference tables, facts (this runs the library's test suite: 35 seconds
  # measured on a developer machine, likely longer on Netlify's build image),
  # redirects, astro build, and the verifier (skipped here, see below).
  # `git fetch --unshallow` keeps the full history for last-updated dates.
  # `command -v pnpm` is a fallback for PNPM_VERSION below, until a real deploy
  # confirms the pin.
  command = "git fetch --unshallow || true; command -v pnpm >/dev/null || npm install --global pnpm@11; cd .. && pnpm install --frozen-lockfile && pnpm build && pnpm --filter slotsmith-docs build"

[build.environment]
  # The docs scripts run .ts files directly, which needs Node 22.18 or newer
  # (CI uses 22).
  NODE_VERSION = "22.18.0"
  # pnpm 11, as CI uses. Without this Netlify picks a pnpm
  # version from the lockfile.
  PNPM_VERSION = "11"
  # The verifier drives a real browser (Playwright). Netlify's build image is
  # not set up for that, and CI already runs it on every change before merge,
  # so the Netlify build skips it. Remove this to verify on deploy.
  DOCS_SKIP_VERIFY = "1"

# Hashed build assets never change: cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Markdown copies of every page (<path>index.md) and the llms files are UTF-8:
# without the charset, Arabic copies show as mojibake in a browser.
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
